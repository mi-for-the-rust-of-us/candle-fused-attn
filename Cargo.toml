[package]
name = "candle-fused-attn"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Eric Jacopin"]
description = "A fused fp32 scaled-dot-product attention for candle, forward AND backward (FlashAttention-2 algorithm, deterministic backward), as a CustomOp3 over stock candle."
license = "MIT OR Apache-2.0"
keywords = ["candle", "attention", "cuda", "flash-attention", "training"]
categories = ["science", "algorithms"]
publish = false

[dependencies]
candle-core = "0.11"

[build-dependencies]
cudaforge = { version = "0.1.6", optional = true }

[features]
default = []
# The CUDA kernels. Without it the op still works on CPU (the composed reference), so the crate
# builds and its gradient tests run on a machine with no CUDA toolkit.
cuda = ["candle-core/cuda", "dep:cudaforge"]

# The candle half of `bench/compare.py`; it brackets nsys captures through candle's cudarc.
[[example]]
name = "compare"
required-features = ["cuda"]

[lints.rust]
elided_lifetimes_in_paths = "deny"
missing_docs              = "warn"
unsafe_code               = "deny"

[lints.clippy]
unwrap_used               = "deny"
expect_used               = "deny"
panic                     = "deny"
indexing_slicing          = "deny"
wildcard_enum_match_arm   = "deny"
match_wildcard_for_single_variants = "deny"
as_conversions            = "warn"
cast_possible_truncation  = "warn"
missing_docs_in_private_items = "warn"
missing_errors_doc        = "warn"
pedantic  = { level = "warn", priority = -1 }
nursery   = { level = "warn", priority = -1 }
module_name_repetitions   = "allow"
must_use_candidate        = "warn"
