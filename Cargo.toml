[package]
name = "candle-fused-attn"
version = "0.2.0"
edition = "2024"
# The MSRV of the org's leaf libraries (anamnesis, hypomnesis); also this crate's true floor:
# candle-core 0.11 pulls zip 8.6, which needs 1.88 (built and tested with +1.88 --locked).
rust-version = "1.88"
authors = ["Eric Jacopin"]
description = "Fused fp32 scaled-dot-product attention for candle, forward AND backward: the FlashAttention-2 algorithm in plain fp32, a bit-reproducible backward, over stock candle."
license = "MIT OR Apache-2.0"
keywords = ["candle", "attention", "fp32", "cuda", "training"]
categories = ["science", "algorithms"]
repository = "https://github.com/mi-for-the-rust-of-us/candle-fused-attn"
homepage = "https://github.com/mi-for-the-rust-of-us/candle-fused-attn"
documentation = "https://docs.rs/candle-fused-attn"
readme = "README.md"
# The benchmark's outputs and local Python caches are not part of the crate.
exclude = ["target/", "bench/__pycache__/", ".github/"]

[dependencies]
candle-core = "0.11"

# docs.rs has no CUDA toolkit: it documents the default (CPU) feature set.
[package.metadata.docs.rs]
no-default-features = true

[build-dependencies]
cudaforge = { version = "0.1.6", optional = true }

[features]
default = []
# The CUDA kernels. Without it the op still works on CPU (the composed reference), so the crate
# builds and its gradient tests run on a machine with no CUDA toolkit.
cuda = ["candle-core/cuda", "dep:cudaforge"]

# The candle half of `bench/compare.py`; it brackets nsys captures through candle's cudarc.
[[example]]
name = "compare"
required-features = ["cuda"]

[lints.rust]
elided_lifetimes_in_paths = "deny"
missing_docs              = "warn"
unsafe_code               = "deny"

[lints.clippy]
unwrap_used               = "deny"
expect_used               = "deny"
panic                     = "deny"
indexing_slicing          = "deny"
wildcard_enum_match_arm   = "deny"
match_wildcard_for_single_variants = "deny"
as_conversions            = "warn"
cast_possible_truncation  = "warn"
missing_docs_in_private_items = "warn"
missing_errors_doc        = "warn"
pedantic  = { level = "warn", priority = -1 }
nursery   = { level = "warn", priority = -1 }
module_name_repetitions   = "allow"
must_use_candidate        = "warn"
