name: Publish to crates.io

on:
  push:
    # Publish only on release tags vMAJOR.MINOR.PATCH; a hyphenated tag (v0.2.0-rc.1) is a git-level
    # checkpoint only. GitHub does not allow `tags` and `tags-ignore` on one event, hence the `!`.
    tags:
      - "v*"
      - "!v*-*"
  # A manual run is a REHEARSAL unless `dry_run` is unchecked. Start it from a hyphenated tag
  # (`v0.2.0-rc.1`: pushing one triggers nothing, and it matches the `release` environment's `v*`):
  # `verify` runs in full; `publish` waits for approval, exchanges the Trusted Publishing token (so
  # crates.io checks this repository, this workflow file and the environment), then runs
  # `cargo publish --dry-run`; no GitHub Release is created. The auth action's `post` step revokes
  # the unused token when the job ends.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: everything but the upload and the GitHub Release"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

# SUPPLY-CHAIN POSTURE, as in the org's other crates (candle-mi, anamnesis):
#   * No registry secret: `cargo publish` authenticates through crates.io Trusted Publishing, an
#     OIDC token exchanged for a ~30-minute crates.io token bound to this repository, this
#     workflow file and the `release` environment.
#   * Every third-party action pinned to a full commit SHA; no build cache in these jobs.
#   * A human in the loop: the `release` environment requires the maintainer's approval.
#   * No dependency code runs while the job can mint that token: building and testing (build
#     scripts, proc-macros) happens in `verify`, which holds a read-only token; `publish` runs
#     `cargo publish --no-verify`, which compiles nothing. Every cargo command uses `--locked`.
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # Only a `v*` tag may publish; a `workflow_dispatch` run must be started from the tag.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (v1)
        with:
          toolchain: stable
          components: clippy, rustfmt

      # The tag must name Cargo.toml's version (never tag before bumping), and CHANGELOG.md must
      # have that version's section: a tag whose `## [Unreleased]` was never renamed fails here,
      # BEFORE anything is published. A dry run, started from an rc tag, checks the section only.
      - name: Check the tag, the version and its CHANGELOG section
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "${DRY_RUN:-}" != "true" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not name the version in Cargo.toml, ${version}" >&2
            exit 1
          fi
          scripts/release-notes.sh "$version" > /dev/null
        env:
          DRY_RUN: ${{ inputs.dry_run }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (CPU path)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests (CPU path)
        run: cargo test --locked

      # The tutorial's code runs, and every code block of docs/tutorial.md is that code.
      - name: Tutorial (CPU path)
        run: cargo run --locked --example tutorial

      - name: Tutorial blocks match the example
        run: |
          python3 -m doctest scripts/check-tutorial.py
          python3 scripts/check-tutorial.py

      - name: Doc check
        run: cargo doc --locked --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Package and verify
        run: cargo package --locked

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (v1)
        with:
          toolchain: stable

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        if: ${{ inputs.dry_run != true }}
        run: cargo publish --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      # The rehearsal: the token exchange above already proved the Trusted Publishing setup; this
      # uploads nothing and needs no token.
      - name: Publish to crates.io (dry run)
        if: ${{ inputs.dry_run == true }}
        run: cargo publish --locked --no-verify --dry-run

  release:
    name: GitHub Release
    needs: publish
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > release-body.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes-file release-body.md --verify-tag
